services:
  db:
    image: postgres:16-alpine
    container_name: meteor_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meteor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meteor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meteor_net

  airflow:
    build:
      context: .
      dockerfile: docker/Airflow.Dockerfile
      args:
        AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    container_name: meteor_airflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-meteor_db}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-meteor_secret_key}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meteor_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql:ro
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_USERNAME:-admin} --firstname admin --lastname admin --role Admin --email admin@example.com --password ${AIRFLOW_PASSWORD:-admin} 2>/dev/null || true;
        airflow scheduler &
        exec airflow webserver
      "
    networks:
      - meteor_net

  streamlit:
    build:
      context: .
      dockerfile: docker/Streamlit.Dockerfile
    container_name: meteor_streamlit
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meteor_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app
      - ./src:/app/src
    networks:
      - meteor_net

volumes:
  postgres_data:
  airflow_logs:

networks:
  meteor_net:
    driver: bridge